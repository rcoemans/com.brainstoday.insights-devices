<!DOCTYPE html>
<html>
<head>
    <script type="text/javascript" src="/homey.js" data-origin="pairing"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
        }
        .field-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .help-text {
            color: #666;
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1 data-i18n="pair.device_settings.title">Configure Ground Level Monitor</h1>
    
    <div class="field-group">
        <label for="device_name" data-i18n="pair.device_settings.name">Device Name</label>
        <input type="text" id="device_name" placeholder="Ground Level Monitor" value="Ground Level Monitor">
        <p class="help-text" data-i18n="pair.device_settings.name_hint">Enter a name for this device</p>
    </div>

    <div class="field-group">
        <label for="mqtt_topic" data-i18n="pair.device_settings.topic">MQTT Topic</label>
        <input type="text" id="mqtt_topic" placeholder="sensor/crawlSpaceHeight" value="sensor/crawlSpaceHeight">
        <p class="help-text" data-i18n="pair.device_settings.topic_hint">The MQTT topic to subscribe to for ground level data</p>
    </div>

    <div class="field-group">
        <label for="unit" data-i18n="pair.device_settings.unit">Unit</label>
        <input type="text" id="unit" placeholder="cm" value="cm">
        <p class="help-text" data-i18n="pair.device_settings.unit_hint">Measurement unit (e.g., cm, m)</p>
    </div>

    <div class="field-group">
        <label for="alarm_threshold" data-i18n="pair.device_settings.threshold">Alarm Threshold (optional)</label>
        <input type="number" id="alarm_threshold" placeholder="0" value="0">
        <p class="help-text" data-i18n="pair.device_settings.threshold_hint">Trigger alarm when level exceeds this value (0 = disabled)</p>
    </div>

    <script>
        function onHomeyReady(Homey) {
            Homey.ready();

            Homey.on('continue', function() {
                const deviceData = {
                    name: document.getElementById('device_name').value || 'Ground Level Monitor',
                    mqtt_topic: document.getElementById('mqtt_topic').value || 'sensor/crawlSpaceHeight',
                    unit: document.getElementById('unit').value || 'cm',
                    alarm_threshold: parseFloat(document.getElementById('alarm_threshold').value) || 0
                };

                Homey.emit('device_settings', deviceData);
            });
        }
    </script>
</body>
</html>
